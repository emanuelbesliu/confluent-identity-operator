name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.6"

jobs:
  # Phase 1 — unit: static checks, race-enabled unit tests and a compile.
  # Touches no external service (no Confluent Cloud org).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build
        run: go build ./...

      - name: Docker build
        run: docker build -t confluent-identity-operator:ci .

  # Phase 2 — lint: formatting and module hygiene.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-ed:"; echo "$out"; exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Phase 3 — vuln: scan code + dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Phase 4 — helm-lint: validate the chart renders with required values.
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint charts/confluent-identity-operator \
            --set clusterName=ci \
            --set confluent.identityProviderId=op-x \
            --set image.repository=example/confluent-identity-operator \
            --set confluent.credentials.existingSecret=s

  # Phase 5 — e2e: spin up a kind cluster and an in-cluster MOCK Confluent Cloud
  # API, install the operator, apply sample CRs and assert a pool + role binding
  # are created. No real Confluent Cloud org is contacted.
  e2e:
    runs-on: ubuntu-latest
    needs: [unit, lint, helm-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run e2e (kind + mock Confluent Cloud)
        run: bash test/e2e/run.sh
