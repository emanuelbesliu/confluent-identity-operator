---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: confluentidentitypools.confluentoauth.io
spec:
  group: confluentoauth.io
  names:
    kind: ConfluentIdentityPool
    listKind: ConfluentIdentityPoolList
    plural: confluentidentitypools
    shortNames:
    - cip
    singular: confluentidentitypool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.poolId
      name: Pool
      type: string
    - jsonPath: .status.conditions[?(@.type=="PoolReady")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConfluentIdentityPool is the Schema for the confluentidentitypools
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConfluentIdentityPoolSpec defines the desired state of a Confluent Cloud
              identity pool for a single AKS workload. A pool created by this operator has
              ZERO role bindings — it grants authentication only; every topic operation is
              403 until a ConfluentRoleBinding grants access.
            properties:
              audience:
                description: |-
                  Audience is the shared audience app registration client-id that all pool
                  filters pin as `claims.aud`. Sourced from the trust-layer Terraform
                  output; overridable per-CR.
                minLength: 1
                type: string
              description:
                description: Description is an optional human-readable description
                  stored on the pool.
                type: string
              displayName:
                description: |-
                  DisplayName is the deterministic Confluent pool display name
                  (`<cluster>-<ns>-<app>`). Used as the idempotency key when looking the
                  pool up in Confluent Cloud.
                minLength: 1
                type: string
              identityConfigRef:
                description: |-
                  IdentityConfigRef is where to read the workload's azp (clientId) and oid
                  (principalId) that pin the pool's CEL filter.
                properties:
                  clientIdKey:
                    default: clientId
                    description: ClientIDKey is the ConfigMap key holding the UAMI
                      client id (azp claim).
                    type: string
                  name:
                    description: Name of the ConfigMap holding the UAMI identity attributes.
                    minLength: 1
                    type: string
                  principalIdKey:
                    default: principalId
                    description: |-
                      PrincipalIDKey is the ConfigMap key holding the UAMI principal/object id
                      (oid claim).
                    type: string
                required:
                - name
                type: object
            required:
            - audience
            - displayName
            - identityConfigRef
            type: object
          status:
            description: ConfluentIdentityPoolStatus defines the observed state.
            properties:
              appliedFilter:
                description: AppliedFilter is the CEL filter currently set on the
                  pool.
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations. Types:
                  IdentityResolved, PoolReady, Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedClientId:
                description: ObservedClientID is the azp value last read from the
                  identity ConfigMap.
                type: string
              observedPrincipalId:
                description: ObservedPrincipalID is the oid value last read from the
                  identity ConfigMap.
                type: string
              poolId:
                description: PoolID is the Confluent Cloud identity pool id (pool-xxxx).
                type: string
              providerId:
                description: ProviderID is the identity provider the pool belongs
                  to (op-xxxx).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
