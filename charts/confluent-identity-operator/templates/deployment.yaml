apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "confluent-identity-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "confluent-identity-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "confluent-identity-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "confluent-identity-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "confluent-identity-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: CONFLUENT_API_BASE
              value: {{ .Values.confluent.apiBase | quote }}
            - name: CONFLUENT_IDENTITY_PROVIDER_ID
              value: {{ required "confluent.identityProviderId is required" .Values.confluent.identityProviderId | quote }}
            - name: CONFLUENT_AUDIENCE
              value: {{ .Values.confluent.audience | quote }}
            - name: CONFLUENT_CRN_SCOPE
              value: {{ .Values.confluent.crnScope | quote }}
            - name: LEADER_ELECT
              value: {{ .Values.leaderElection | quote }}
            - name: DRY_RUN
              value: {{ .Values.safety.dryRun | quote }}
            - name: OWNED_PREFIX
              value: {{ .Values.safety.ownedPrefix | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: CONFLUENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "confluent-identity-operator.credentialsSecretName" . }}
                  key: {{ .Values.confluent.credentials.apiKeyKey }}
            - name: CONFLUENT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "confluent-identity-operator.credentialsSecretName" . }}
                  key: {{ .Values.confluent.credentials.apiSecretKey }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
