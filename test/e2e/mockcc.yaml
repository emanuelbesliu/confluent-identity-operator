apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockcc
  namespace: confluent-operator
  labels:
    app: mockcc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockcc
  template:
    metadata:
      labels:
        app: mockcc
    spec:
      containers:
        - name: mockcc
          image: mockcc:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mockcc
  namespace: confluent-operator
  labels:
    app: mockcc
spec:
  selector:
    app: mockcc
  ports:
    - port: 80
      targetPort: 8080
